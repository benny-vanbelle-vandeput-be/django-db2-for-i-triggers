# Updates of the pinned dev and test tooling arrive as pull requests the
# maintainer merges deliberately, never overnight on main. Copied from
# django-db2-for-i (.github/dependabot.yml).
#
# - uv: the tooling in uv.lock (pytest, pytest-django, ruff and what they
#   need), weekly, in one grouped pull request, lock only. Django, pyodbc and
#   the backend are ignored: the backend is pinned to a git tag by hand, and
#   the nox sessions install the newest Django release users get.
# - github-actions: the actions of the workflows, monthly, grouped.
# - cooldown: a release is offered only once it is 7 days old.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: django
      - dependency-name: pyodbc
      - dependency-name: django-db2-for-i
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: build
    labels: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: []
